services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: suraksha-sutra-api:${APP_VERSION:-local}
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    image: suraksha-sutra-web:${APP_VERSION:-local}
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      retries: 6
    security_opt:
      - no-new-privileges:true
